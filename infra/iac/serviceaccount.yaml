# The workload's identity.
#
# A dedicated account rather than `default`, so that any permission the workload is ever granted
# is granted to this workload and not to everything else in the namespace. It is deliberately
# bound to no Role or ClusterRole: the API needs nothing from the Kubernetes API, and the pod
# does not even mount the token (see automountServiceAccountToken in deployment.yaml).
#
# The annotation is where the real identity comes from. Once the audit and approval stores are
# durable, this account is federated to a managed identity via AKS workload identity, and the
# application reaches Key Vault and the database with no secret of its own to leak.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regulated-ai-workflow-engine
  labels:
    app.kubernetes.io/name: regulated-ai-workflow-engine
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: regulated-ai
  annotations:
    azure.workload.identity/client-id: 'REPLACE_ME-client-id'
automountServiceAccountToken: false
