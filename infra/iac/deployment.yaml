# The API Deployment.
#
# The name must stay `regulated-ai-workflow-engine`: the pipeline's rollout check runs
# `kubectl rollout status deployment/$(imageRepository)` against exactly this name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulated-ai-workflow-engine
  labels:
    app.kubernetes.io/name: regulated-ai-workflow-engine
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: regulated-ai
spec:
  # ------------------------------------------------------------------------------------------
  # One replica, deliberately, and this is a defect rather than a choice.
  #
  # The data layer is IMemoryCache, so every pod holds its own approvals and its own audit
  # trail. With two replicas an approver could record an approval on pod A, the workflow run
  # referencing it could land on pod B, and the action would be refused as unapproved — or,
  # worse, a tenant's audit trail would be split across pods with neither copy complete.
  #
  # This is the single clearest argument for the durable stores described in
  # PRODUCTION_NOTES.md. Until those exist, this must not be scaled, and there is no
  # HorizontalPodAutoscaler here for the same reason. A PodDisruptionBudget is also omitted:
  # at one replica it could only block node drains, not preserve availability.
  # ------------------------------------------------------------------------------------------
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: regulated-ai-workflow-engine

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Bring the new pod up before removing the old one. At one replica maxUnavailable: 1
      # would mean a deployment is also a brief outage.
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: regulated-ai-workflow-engine
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: regulated-ai
      annotations:
        # Roll the pods when the signing key changes, so a rotated secret actually takes effect
        # instead of waiting for the next unrelated deployment.
        checksum/secret: 'REPLACED_BY_PIPELINE'
    spec:
      serviceAccountName: regulated-ai-workflow-engine

      # No API access is needed from inside the pod, and a mounted token is a credential an
      # attacker who reaches the container would otherwise find waiting.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        runAsGroup: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # Tag is substituted by the pipeline with $(Build.BuildId)-$(Build.SourceVersion).
          # Never `latest`: "which build is running?" is the first question in an incident.
          image: 'REPLACE_ME.azurecr.io/regulated-ai-workflow-engine:REPLACED_BY_PIPELINE'
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: 'Production'

            # ASP.NET Core reads nested configuration from environment variables using a double
            # underscore, so this binds to Jwt:SigningKey — the same key JwtOptions.Validate()
            # checks at startup. The pod will refuse to start if it is missing or too short,
            # which is the intended behaviour: a service that boots with a weak signing key has
            # failed in the wrong direction.
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: regulated-ai-jwt
                  key: signing-key

            # Present only because the brief rules out an identity provider. A real deployment
            # federates and this disappears entirely, along with the seeded accounts.
            - name: Jwt__SeedUserPassword
              valueFrom:
                secretKeyRef:
                  name: regulated-ai-jwt
                  key: seed-user-password

            # Cross-origin access is deny-by-default in configuration. Set the real front-end
            # origins here per environment; never a wildcard, which CorsOptions.Validate()
            # refuses at startup anyway.
            - name: Cors__AllowedOrigins__0
              value: ''

          # ------------------------------------------------------------------------------------
          # Probes
          #
          # Both point at /health, which is a liveness check: it reports that the process is
          # answering, not that it can reach its dependencies. That is honest today because the
          # data layer is in-process, and it becomes wrong the moment there is a real audit
          # store — at which point readiness needs its own endpoint that checks it, or a rolling
          # update will send traffic to a pod that cannot write an audit event.
          # ------------------------------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: '100m'
              memory: '192Mi'
            limits:
              # No CPU limit on purpose: CFS throttling on a request-serving process turns a busy
              # moment into latency spikes. The request reserves capacity; the namespace quota
              # bounds the blast radius.
              memory: '512Mi'

          volumeMounts:
            # readOnlyRootFilesystem is on, and the runtime still needs somewhere to write.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      # Give in-flight workflow runs a moment to finish rather than cutting them off mid-audit.
      terminationGracePeriodSeconds: 30
